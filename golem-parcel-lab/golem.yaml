# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.6.0/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.6.0/golem.schema.json

# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

manifestVersion: 1.6.0

app: golem-parcel-lab

version:
  git:
    tagPattern: "v*"
    hashFallback: true
    staticFallback: "v0.0.0"

environments:
  local:
    server: local
    version:
      git:
        allowDirty: true
  cloud:
    server: cloud
    deployment:
      versionCheck: true
components:
  golem-parcel-lab:ts-main:
    dir: ""
    templates: ts

tools:
  knife:
    component: golem-parcel-lab:ts-main
  middleware:
    knife-policy:
      component: golem-parcel-lab:ts-main

agents:
  ParcelAgent:
    tools:
      knife:
        filesystemAccess: allowed
        secretKeysReadable: []
        secretKeysRevealable: []
        middleware:
          - name: knife-policy
            filesystemAccess: denied
    files:
      - sourcePath: ./fixtures/parcel.cuts
        targetPath: /workspace/parcel.cuts
        permissions: read-write
      - sourcePath: ./fixtures/safety-cable.txt
        targetPath: /protected/safety-cable.txt
        permissions: read-write
    initialCard:
      lowerBound:
        positive:
          - "env(?agent) @ ?agent : read : GOLEM_AGENT_ID"
          - "env(?agent) @ ?agent : read : GOLEM_COMPONENT_ID"
          - "env(?agent) @ ?agent : read : GOLEM_COMPONENT_REVISION"
          - "env(?agent) @ ?agent : read : GOLEM_AGENT_TYPE"
          - "tool(?component/knife) @ ?agent : invoke : *"
          - "filesystem(?agent) @ ?agent : read : /**"
          - "filesystem(?agent) @ ?agent : stat : /**"
          - "filesystem(?agent) @ ?agent : list : /**"
          - "filesystem(?agent) @ ?agent : * : /workspace/**"
      upperBound:
        negative:
          - "filesystem(?agent) @ ?agent : write : /protected/**"
          - "filesystem(?agent) @ ?agent : delete : /protected/**"

localServer:
  routerAddr: 127.0.0.1
  routerPort: 58410
  customRequestPort: 58411
  mcpPort: 58412
  dataDir: .data/server-data
